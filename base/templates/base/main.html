<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyBud</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0f0e0c;
      --surface:   #1a1916;
      --surface2:  #242220;
      --border:    #2e2c29;
      --accent:    #c9a84c;
      --accent2:   #e8c97a;
      --text:      #e8e4dc;
      --muted:     #7a7672;
      --danger:    #c0544a;
      --radius:    10px;
      --font-head: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent2); }

    img { display: block; max-width: 100%; }

    /* ── Navbar ── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,14,12,.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .navbar__logo {
      font-family: var(--font-head);
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .navbar__logo span { color: var(--text); font-style: italic; }

    .navbar__search {
      flex: 1;
      max-width: 380px;
    }
    .navbar__search form {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0 1rem;
      transition: border-color .2s;
    }
    .navbar__search form:focus-within { border-color: var(--accent); }
    .navbar__search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: .875rem;
      padding: .55rem 0;
      width: 100%;
    }
    .navbar__search input::placeholder { color: var(--muted); }
    .navbar__search button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
    }
    .navbar__search button:hover { color: var(--accent); }

    .navbar__actions { display: flex; align-items: center; gap: .75rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 500;
      padding: .5rem 1.1rem;
      border-radius: 40px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #0f0e0c;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #0f0e0c; }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: .85rem; color: var(--accent);
      flex-shrink: 0;
      overflow: hidden;
    }

    /* ── Messages ── */
    .messages-wrapper {
      position: fixed;
      top: 70px; right: 1.5rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .flash-msg {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      color: var(--text);
      padding: .7rem 1rem;
      border-radius: var(--radius);
      font-size: .85rem;
      animation: slideIn .3s ease;
    }
    .flash-msg.error { border-left-color: var(--danger); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Layout ── */
    .page { max-width: 1280px; margin: 0 auto; padding: 2rem; }
    .page-center { max-width: 480px; margin: 4rem auto; padding: 0 1.5rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Tag / badge ── */
    .tag {
      display: inline-block;
      padding: .2rem .7rem;
      border-radius: 40px;
      font-size: .75rem;
      font-weight: 500;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .tag:hover { border-color: var(--accent); color: var(--accent); }
    .tag.active { background: var(--accent); color: #0f0e0c; border-color: var(--accent); }

    /* ── Divider ── */
    hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="{% url 'home' %}" class="navbar__logo">Study<span>Bud</span></a>

    <div class="navbar__search">
      <form action="{% url 'home' %}" method="GET">
        <button type="submit">🔍</button>
        <input type="text" name="q" placeholder="Search rooms…" value="{{ request.GET.q }}"/>
      </form>
    </div>

    <div class="navbar__actions">
      {% if request.user.is_authenticated %}
        <a href="{% url 'user-profile' request.user.id %}" class="avatar" title="{{ request.user.username }}">
          {{ request.user.username|first|upper }}
        </a>
        <a href="{% url 'create-room' %}" class="btn btn-primary">+ New Room</a>
        <a href="{% url 'logout' %}" class="btn btn-ghost">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-ghost">Login</a>
        <a href="{% url 'register' %}" class="btn btn-primary">Sign Up</a>
      {% endif %}
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="messages-wrapper">
    {% for message in messages %}
      <div class="flash-msg {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  {% block content %}{% endblock %}

</body>
</html>
