<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyBud</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:          #0d0e1a;
      --bg2:         #111220;
      --glass:       rgba(255,255,255,0.05);
      --glass2:      rgba(255,255,255,0.09);
      --glass3:      rgba(255,255,255,0.13);
      --border:      rgba(255,255,255,0.08);
      --border2:     rgba(255,255,255,0.14);
      --border3:     rgba(255,255,255,0.22);

      --violet:      #9b8aff;
      --violet2:     #c4baff;
      --violet-glow: rgba(155,138,255,0.22);
      --violet-soft: rgba(155,138,255,0.10);
      --cyan:        #5ce8de;
      --cyan-glow:   rgba(92,232,222,0.18);
      --peach:       #ffb87a;
      --peach-glow:  rgba(255,184,122,0.18);
      --indigo:      #7080ff;

      --text:        #dde0f5;
      --text2:       #8e90b0;
      --text3:       #52536e;
      --danger:      #ff7070;

      --r-sm:  8px;
      --r-md:  14px;
      --r-lg:  20px;
      --r-xl:  28px;
      --nav-h: 64px;

      --font-h: 'Playfair Display', Georgia, serif;
      --font-b: 'Outfit', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-b);
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ─── Ambient background ─── */
    .amb {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: .4;
      animation: orbf 14s ease-in-out infinite;
    }
    .orb-1 { width:700px;height:700px; background:radial-gradient(circle,#2d1f6e,transparent 65%); top:-250px;left:-150px; animation-delay:0s; }
    .orb-2 { width:500px;height:500px; background:radial-gradient(circle,#0e3545,transparent 65%); top:15%;right:-180px; animation-delay:-5s; }
    .orb-3 { width:450px;height:450px; background:radial-gradient(circle,#1e1040,transparent 65%); bottom:-80px;left:25%; animation-delay:-9s; }
    .orb-4 { width:380px;height:380px; background:radial-gradient(circle,#0b2535,transparent 65%); bottom:15%;right:5%; animation-delay:-3s; }

    @keyframes orbf {
      0%,100% { transform:translate(0,0) scale(1); }
      33%      { transform:translate(25px,-18px) scale(1.04); }
      66%      { transform:translate(-18px,12px) scale(.97); }
    }

    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    #ptc { position:fixed; inset:0; z-index:1; pointer-events:none; }

    #cg {
      position:fixed; width:280px; height:280px; border-radius:50%;
      background:radial-gradient(circle,rgba(155,138,255,.055) 0%,transparent 70%);
      pointer-events:none; z-index:1;
      transform:translate(-50%,-50%);
      transition:opacity .3s;
    }

    /* ─── Page shell ─── */
    .shell { position:relative; z-index:2; min-height:100vh; }

    /* ─── Navbar ─── */
    .nav {
      position:sticky; top:0; z-index:100;
      height:var(--nav-h);
      padding:0 2rem;
      display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
      background:rgba(13,14,26,.8);
      backdrop-filter:blur(24px) saturate(1.5);
      border-bottom:1px solid var(--border);
    }
    .nav::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,var(--violet-glow),var(--cyan-glow),transparent);
    }

    .nav-logo {
      font-family: var(--font-h);
      font-size: 1.5rem; font-weight:700; letter-spacing:.01em;
      background:linear-gradient(130deg,var(--violet) 0%,var(--cyan) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; white-space:nowrap;
    }

    .nav-search { flex:1; max-width:360px; }
    .nav-search form {
      display:flex; align-items:center; gap:.5rem;
      background:var(--glass); border:1px solid var(--border);
      border-radius:40px; padding:0 1rem;
      transition:border-color .25s, background .25s, box-shadow .25s;
    }
    .nav-search form:focus-within {
      background:var(--glass2); border-color:var(--border2);
      box-shadow:0 0 0 3px var(--violet-soft);
    }
    .nav-search input {
      background:none; border:none; outline:none;
      color:var(--text); font-family:var(--font-b); font-size:.875rem; padding:.55rem 0; width:100%;
    }
    .nav-search input::placeholder { color:var(--text3); }
    .nav-search button {
      background:none; border:none; color:var(--text3);
      cursor:pointer; font-size:.9rem; padding:0; transition:color .2s;
    }
    .nav-search button:hover { color:var(--violet); }

    .nav-actions { display:flex; align-items:center; gap:.6rem; }

    /* ─── Buttons ─── */
    .btn {
      display:inline-flex; align-items:center; gap:.4rem;
      font-family:var(--font-b); font-size:.84rem; font-weight:500;
      padding:.48rem 1.1rem; border-radius:40px; border:1px solid transparent;
      cursor:pointer; transition:all .25s cubic-bezier(.34,1.56,.64,1);
      white-space:nowrap;
    }
    .btn:active { transform:scale(.96); }

    .btn-primary {
      background:linear-gradient(135deg,var(--violet),var(--indigo));
      color:#fff; border-color:transparent;
      box-shadow:0 4px 18px var(--violet-glow);
    }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 8px 28px var(--violet-glow); color:#fff; }

    .btn-ghost {
      background:var(--glass); color:var(--text2); border-color:var(--border);
    }
    .btn-ghost:hover { background:var(--glass2); border-color:var(--border2); color:var(--text); }

    .btn-danger {
      background:rgba(255,112,112,.08); color:var(--danger);
      border-color:rgba(255,112,112,.2);
    }
    .btn-danger:hover { background:rgba(255,112,112,.17); border-color:var(--danger); }

    /* ─── Avatar ─── */
    .av {
      width:34px; height:34px; border-radius:50%;
      background:linear-gradient(135deg,rgba(155,138,255,.2),rgba(92,232,222,.12));
      border:1px solid var(--border2);
      display:flex; align-items:center; justify-content:center;
      font-weight:600; font-size:.8rem; color:var(--violet); flex-shrink:0;
      transition:box-shadow .2s;
    }
    .av:hover { box-shadow:0 0 12px var(--violet-glow); }

    .av-lg {
      width:56px; height:56px; font-size:1.1rem;
      background:linear-gradient(135deg,rgba(155,138,255,.25),rgba(92,232,222,.15));
    }

    /* ─── Glass card ─── */
    .gc {
      background:var(--glass);
      border:1px solid var(--border);
      border-radius:var(--r-lg);
      backdrop-filter:blur(16px);
      transition:border-color .25s, transform .3s, box-shadow .3s;
    }
    .gc:hover {
      border-color:var(--border2);
      box-shadow:0 12px 48px rgba(0,0,0,.35);
    }

    /* ─── Tag ─── */
    .tag {
      display:inline-block; padding:.2rem .7rem; border-radius:40px;
      font-size:.72rem; font-weight:500; letter-spacing:.02em;
      background:var(--violet-soft); color:var(--violet2);
      border:1px solid rgba(155,138,255,.18); transition:all .2s;
    }
    .tag:hover { background:rgba(155,138,255,.2); border-color:var(--violet); color:#fff; }
    .tag.active { background:var(--violet); color:#fff; border-color:var(--violet); }

    /* ─── Icon button ─── */
    .ib {
      display:inline-flex; align-items:center; justify-content:center;
      width:30px; height:30px; background:var(--glass); border:1px solid var(--border);
      border-radius:var(--r-sm); color:var(--text3); font-size:.8rem;
      cursor:pointer; text-decoration:none; transition:all .2s;
    }
    .ib:hover { background:var(--glass2); border-color:var(--border2); color:var(--text); }
    .ib.del:hover { border-color:rgba(255,112,112,.4); color:var(--danger); background:rgba(255,112,112,.07); }

    /* ─── Flash ─── */
    .flash-wrap {
      position:fixed; top:calc(var(--nav-h) + 12px); right:1.5rem;
      z-index:500; display:flex; flex-direction:column; gap:.5rem;
    }
    .flash {
      background:var(--glass2); border:1px solid var(--border2);
      border-left:3px solid var(--violet);
      backdrop-filter:blur(16px); color:var(--text);
      padding:.7rem 1.1rem; border-radius:var(--r-sm);
      font-size:.85rem; max-width:320px;
      animation:fIn .35s cubic-bezier(.34,1.56,.64,1);
    }
    .flash.error { border-left-color:var(--danger); }
    @keyframes fIn { from{opacity:0;transform:translateX(24px) scale(.95)} to{opacity:1;transform:none} }

    .s-title {
      font-size:.68rem; font-weight:600; color:var(--text3);
      letter-spacing:.12em; text-transform:uppercase; margin-bottom:.9rem;
    }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.07); border-radius:2px; }

    @media(max-width:768px){ .nav-search{display:none;} }
  </style>
</head>
<body>

<div class="amb">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>
<div class="grain"></div>
<canvas id="ptc"></canvas>
<div id="cg"></div>

<div class="shell">
  <nav class="nav">
    <a href="{% url 'home' %}" class="nav-logo">StudyBud</a>

    <div class="nav-search">
      <form action="{% url 'home' %}" method="GET">
        <button type="submit">🔍</button>
        <input type="text" name="q" placeholder="Search rooms, topics…" value="{{ request.GET.q }}"/>
      </form>
    </div>

    <div class="nav-actions">
      {% if request.user.is_authenticated %}
        <a href="{% url 'user-profile' request.user.id %}" class="av" title="{{ request.user.username }}">
          {{ request.user.username|first|upper }}
        </a>
        <a href="{% url 'create-room' %}" class="btn btn-primary">✦ New Room</a>
        <a href="{% url 'logout' %}" class="btn btn-ghost">Leave</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-ghost">Login</a>
        <a href="{% url 'register' %}" class="btn btn-primary">Join Free</a>
      {% endif %}
    </div>
  </nav>

  {% if messages %}
  <div class="flash-wrap">
    {% for message in messages %}
      <div class="flash {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script>
  const cg = document.getElementById('cg');
  document.addEventListener('mousemove', e => {
    cg.style.left = e.clientX + 'px';
    cg.style.top  = e.clientY + 'px';
  });

  const cv = document.getElementById('ptc');
  const cx = cv.getContext('2d');
  let W, H, pts = [];

  function rsz() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  rsz();
  window.addEventListener('resize', rsz);

  const PC = ['rgba(155,138,255,','rgba(92,232,222,','rgba(255,184,122,','rgba(110,128,255,'];
  for (let i = 0; i < 50; i++) {
    pts.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: Math.random()*1.4+.3,
      vx:(Math.random()-.5)*.22,
      vy:(Math.random()-.5)*.22,
      c: PC[Math.floor(Math.random()*PC.length)],
      a: Math.random()*.45+.12,
      p: Math.random()*Math.PI*2
    });
  }

  let mx=-999,my=-999;
  document.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });

  function tick() {
    cx.clearRect(0,0,W,H);
    pts.forEach(p => {
      p.p += .011;
      const a = p.a + Math.sin(p.p)*.1;
      cx.beginPath();
      cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle = p.c + a + ')';
      cx.fill();
      const dx=mx-p.x, dy=my-p.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<140){ p.vx+=dx/d*.01; p.vy+=dy/d*.01; }
      p.vx*=.985; p.vy*=.985;
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    });
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
