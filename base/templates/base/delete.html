{% extends 'base/main.html' %}
{% block content %}

<style>
  .delete-page {
    min-height: calc(100vh - 62px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .delete-card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    text-align: center;
    animation: cardIn .4s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  .delete-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
    animation: shake .5s ease .3s both;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .delete-title {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 400;
    margin-bottom: .5rem;
  }

  .delete-sub {
    color: var(--muted);
    font-size: .9rem;
    margin-bottom: .75rem;
    line-height: 1.6;
  }

  .delete-obj {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .75rem 1rem;
    font-style: italic;
    color: var(--text);
    margin-bottom: 2rem;
    font-family: var(--font-head);
    font-size: 1.05rem;
  }

  .delete-actions {
    display: flex;
    gap: .75rem;
    justify-content: center;
  }

  .btn-confirm-delete {
    background: var(--danger);
    color: #fff;
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: .7rem 1.75rem;
    font-family: var(--font-body);
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-confirm-delete:hover { background: #a8453c; border-color: #a8453c; }
</style>

<div class="delete-page">
  <div class="delete-card">
    <span class="delete-icon">🗑️</span>
    <h1 class="delete-title">Are you sure?</h1>
    <p class="delete-sub">This action cannot be undone. The following will be permanently deleted:</p>

    <div class="delete-obj">{{ obj }}</div>

    <div class="delete-actions">
      <a href="{% url 'home' %}" class="btn btn-ghost">Cancel</a>
      <form method="POST" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn-confirm-delete">Yes, Delete</button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
