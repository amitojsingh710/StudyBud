{% extends 'base/main.html' %}
{% block content %}
<style>
  .auth-pg {
    min-height:calc(100vh - 64px);
    display:flex; align-items:center; justify-content:center;
    padding:2rem 1rem;
  }

  .auth-wrap {
    width:100%; max-width:440px;
    animation:authIn .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes authIn { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:none} }

  .auth-glow {
    position:absolute; width:500px; height:500px;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle,rgba(155,138,255,.1) 0%,transparent 65%);
    top:50%; left:50%; transform:translate(-50%,-50%);
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)} }

  .auth-card {
    position:relative; z-index:1;
    background:var(--glass);
    border:1px solid var(--border2);
    border-radius:var(--r-xl);
    backdrop-filter:blur(24px);
    padding:2.5rem;
    box-shadow:0 24px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .auth-card::before {
    content:''; position:absolute; inset:0; border-radius:var(--r-xl);
    background:linear-gradient(135deg,rgba(155,138,255,.04) 0%,rgba(92,232,222,.02) 100%);
    pointer-events:none;
  }

  .auth-logo {
    text-align:center; font-family:var(--font-h);
    font-size:2rem; font-weight:700; margin-bottom:.2rem;
    background:linear-gradient(130deg,var(--violet) 0%,var(--cyan) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .auth-sub { text-align:center; color:var(--text3); font-size:.84rem; margin-bottom:2rem; }

  .auth-title {
    font-family:var(--font-h); font-size:1.35rem; font-weight:500;
    text-align:center; margin-bottom:1.6rem; color:var(--text);
  }

  /* Form fields */
  .field { margin-bottom:1.1rem; }
  .field label {
    display:block; font-size:.72rem; font-weight:600; color:var(--text3);
    letter-spacing:.09em; text-transform:uppercase; margin-bottom:.4rem;
  }
  .field input {
    width:100%; background:var(--glass2); border:1px solid var(--border);
    border-radius:var(--r-md); color:var(--text); font-family:var(--font-b);
    font-size:.9rem; padding:.72rem 1rem; outline:none;
    transition:border-color .25s, box-shadow .25s;
  }
  .field input:focus {
    border-color:rgba(155,138,255,.45);
    box-shadow:0 0 0 3px var(--violet-soft);
  }
  .field input::placeholder { color:var(--text3); }

  /* Django form */
  .dj-form p { margin-bottom:1.1rem; }
  .dj-form p label {
    display:block; font-size:.72rem; font-weight:600; color:var(--text3);
    letter-spacing:.09em; text-transform:uppercase; margin-bottom:.4rem;
  }
  .dj-form p input {
    width:100%; background:var(--glass2); border:1px solid var(--border);
    border-radius:var(--r-md); color:var(--text); font-family:var(--font-b);
    font-size:.9rem; padding:.72rem 1rem; outline:none;
    transition:border-color .25s, box-shadow .25s;
  }
  .dj-form p input:focus { border-color:rgba(155,138,255,.45); box-shadow:0 0 0 3px var(--violet-soft); }
  .dj-form ul.errorlist { list-style:none; margin-top:.3rem; }
  .dj-form ul.errorlist li { font-size:.78rem; color:var(--danger); }
  .dj-form .helptext { font-size:.73rem; color:var(--text3); margin-top:.22rem; display:block; }

  .auth-btn {
    width:100%; margin-top:1.4rem;
    background:linear-gradient(135deg,var(--violet),var(--indigo));
    color:#fff; border:none; border-radius:var(--r-md);
    padding:.88rem; font-family:var(--font-h); font-size:1rem; font-weight:500;
    cursor:pointer; letter-spacing:.02em;
    box-shadow:0 6px 24px var(--violet-glow);
    transition:all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .auth-btn:hover { transform:translateY(-1px); box-shadow:0 12px 32px var(--violet-glow); }

  .auth-switch {
    text-align:center; margin-top:1.4rem; font-size:.86rem; color:var(--text3);
  }
  .auth-switch a { color:var(--violet2); }
  .auth-switch a:hover { color:#fff; }

  .divider {
    display:flex; align-items:center; gap:1rem;
    margin:1.5rem 0; color:var(--text3); font-size:.78rem;
  }
  .divider::before,.divider::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg,transparent,var(--border),transparent);
  }
</style>

<div class="auth-pg">
  <div class="auth-wrap" style="position:relative;">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-logo">StudyBud</div>
      <p class="auth-sub">Your cozy digital study space ✦</p>

      {% if page == 'login' %}
        <h2 class="auth-title">Welcome back</h2>
        <form method="POST">
          {% csrf_token %}
          <div class="field">
            <label>Username</label>
            <input type="text" name="username" placeholder="your username" autocomplete="username"/>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <button type="submit" class="auth-btn">Sign In →</button>
        </form>
        <div class="auth-switch">
          New here? <a href="{% url 'register' %}">Create an account</a>
        </div>

      {% else %}
        <h2 class="auth-title">Create your account</h2>
        <form method="POST" class="dj-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="auth-btn">Join StudyBud →</button>
        </form>
        <div class="auth-switch">
          Already a member? <a href="{% url 'login' %}">Sign in</a>
        </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
